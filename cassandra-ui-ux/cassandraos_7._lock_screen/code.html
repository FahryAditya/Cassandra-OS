</span>

</div>
</div>
<div class="absolute bottom-0 right-1 w-5 h-5 rounded-full bg-tertiary flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-[12px] text-on-tertiary" style="font-variation-settings: 'FILL' 1;">terminal</span>
</div>

<div class="text-center mb-space-xl">
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">
            Cassandra Developer
          </h1>
<p class="font-code-sm text-code-sm text-secondary-fixed-dim mt-space-2xs tracking-normal">
            @cass_dev · <span class="text-on-surface-variant">System Administrator</span>
</p>
</div>
<form class="w-full flex flex-col gap-space-md" id="auth-form" onsubmit="event.preventDefault(); triggerUnlock();">
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-space-md flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">keyboard</span>
</div>
<input autocomplete="current-password" class="w-full bg-surface-container-lowest text-on-surface placeholder:text-outline font-code-md text-code-md rounded-lg pl-10 pr-10 py-space-sm focus:outline-none focus:bg-surface-container-lowest transition-colors shadow-inner" id="password-input" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password view" class="absolute inset-y-0 right-0 pr-space-md flex items-center text-on-surface-variant hover:text-tertiary transition-colors" id="toggle-visibility" type="button">
<span class="material-symbols-outlined text-[18px]" id="visibility-icon">visibility_off</span>
</button>

<div class="flex items-center gap-space-sm mt-space-xs">
<button class="flex-1 flex items-center justify-center gap-space-xs bg-primary-container text-on-primary-container py-space-sm rounded-lg font-headline-md text-body-md hover:bg-secondary-container transition-all active:scale-[0.98] shadow-md shadow-primary-container/25 group" id="submit-btn" type="submit">
<span>Authenticate</span>
<span class="material-symbols-outlined text-[18px] group-hover:translate-x-0.5 transition-transform">arrow_forward</span>
</button>
</div>
<div class="flex items-center justify-between mt-space-xs px-space-2xs">
<button class="font-body-sm text-body-sm text-secondary hover:text-tertiary transition-colors flex items-center gap-space-2xs" type="button">
<span class="material-symbols-outlined text-[14px]">supervised_user_circle</span>
<span>Switch User</span>
</button>
<button class="font-body-sm text-body-sm text-on-surface-variant hover:text-on-surface transition-colors" type="button">
              Reset Key?
            </button>
</div>
</form>

<div class="mt-space-md flex items-center gap-space-xs px-space-md py-space-2xs bg-surface-container/60 backdrop-blur-md rounded-full text-secondary font-label-sm text-label-sm" id="status-chip">

</div>

<div class="flex items-center gap-space-sm px-space-md py-space-xs rounded-lg bg-surface-container-low/70 backdrop-blur-md">
<div class="flex items-center gap-space-2xs text-tertiary">
<span class="material-symbols-outlined text-[18px]">wifi</span>

</div>

<div class="flex items-center gap-space-2xs text-on-surface-variant font-code-sm text-code-sm">
<span class="material-symbols-outlined text-[16px]">vpn_key</span>
<span>Encrypted</span>
</div>

<div class="relative group">
<button aria-label="Sleep Mode" class="w-9 h-9 flex items-center justify-center rounded-lg text-on-surface-variant hover:text-tertiary hover:bg-surface-container transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">bedtime</span>
</button>
<div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-space-xs hidden group-hover:flex px-space-sm py-space-2xs bg-surface-container-highest rounded font-label-sm text-label-sm text-on-surface whitespace-nowrap shadow-md pointer-events-none">
            Sleep
          </div>
</div>
<div class="relative group">
<button aria-label="Restart Workstation" class="w-9 h-9 flex items-center justify-center rounded-lg text-on-surface-variant hover:text-tertiary hover:bg-surface-container transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">restart_alt</span>
</button>
<div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-space-xs hidden group-hover:flex px-space-sm py-space-2xs bg-surface-container-highest rounded font-label-sm text-label-sm text-on-surface whitespace-nowrap shadow-md pointer-events-none">
            Restart
          </div>
</div>
<div class="relative group">
<button aria-label="Shut Down" class="w-9 h-9 flex items-center justify-center rounded-lg text-error hover:bg-error-container hover:text-on-error-container transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">power_settings_new</span>
</button>
<div class="absolute bottom-full right-0 mb-space-xs hidden group-hover:flex px-space-sm py-space-2xs bg-surface-container-highest rounded font-label-sm text-label-sm text-error whitespace-nowrap shadow-md pointer-events-none">
            Shut Down
          </div>
</div>
</div>

</div>
</div>
<script>
  const passwordInput = document.getElementById('password-input');
  const toggleBtn = document.getElementById('toggle-visibility');
  const visibilityIcon = document.getElementById('visibility-icon');
  const statusChip = document.getElementById('status-chip');
  const submitBtn = document.getElementById('submit-btn');

  if (toggleBtn && passwordInput && visibilityIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      visibilityIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
    });
  }

  function triggerUnlock() {
    if (!passwordInput || !statusChip || !submitBtn) return;
    
    if (!passwordInput.value) {
      passwordInput.classList.add('bg-error-container/40');
      statusChip.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-error"></span><span class="text-error">Credential required</span>';
      setTimeout(() => {
        passwordInput.classList.remove('bg-error-container/40');
        statusChip.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-tertiary animate-pulse"></span><span>Hardware Enclave Secured • Node 01</span>';
      }, 2000);
      return;
    }

    submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span><span>Verifying...</span>';
    submitBtn.disabled = true;

    setTimeout(() => {
      submitBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check_circle</span><span>Unlocked</span>';
      statusChip.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-tertiary"></span><span class="text-tertiary">Session Activated • Loading Workspace</span>';
    }, 1000);
  }

  function updateClock() {
    const clockEl = document.getElementById('os-time');
    if (!clockEl) return;
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const mins = String(now.getMinutes()).padStart(2, '0');
    clockEl.textContent = `${hours}:${mins}`;
  }
  setInterval(updateClock, 1000);
  updateClock();
</script></main></body></html>
